        color: #0f172a;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }
      ::selection {
        background: rgba(99, 102, 241, 0.2);
      }

      .glass-panel {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(12px);
        border: 1px solid #e2e8f0;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 12px 32px -12px rgba(79, 70, 229, 0.15);
      }
      .inner-glow-border {
        position: relative;
      }
      .inner-glow-border::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1px;
        background: linear-gradient(135deg, rgba(99, 102, 241, 0.35), rgba(217, 70, 239, 0.25), rgba(6, 182, 212, 0.3));
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
      }
      .text-gradient {
        background: linear-gradient(90deg, #4f46e5 0%, #9333ea 50%, #db2777 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .btn-gradient {
        background: linear-gradient(90deg, #4f46e5 0%, #7c3aed 55%, #c026d3 100%);
        color: #fff;
        box-shadow: 0 8px 24px -8px rgba(79, 70, 229, 0.55);
      }
      .scanning-effect,
      .scanline-effect {
        position: relative;
        overflow: hidden;
      }
      .scanning-line {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, transparent, #6366f1, transparent);
        box-shadow: 0 0 12px rgba(99, 102, 241, 0.6);
        z-index: 10;
      }
      .scanline-effect::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 2px;
        background: linear-gradient(to right, transparent, #6366f1, transparent);
        box-shadow: 0 0 8px rgba(99, 102, 241, 0.6);
        animation: scan 3s linear infinite;
      }
      .inner-glow {
        border: 1px solid #e0e7ff;
      }
      .glow-border {
        border: 1px solid #e2e8f0;
        box-shadow: 0 20px 48px -20px rgba(79, 70, 229, 0.25);
      }
      .scanline {
        animation: scan 3s linear infinite;
      }
      @keyframes scan {
        0% { top: 0%; opacity: 0; }
        50% { opacity: 1; }
        100% { top: 100%; opacity: 0; }
      }
    </style>
